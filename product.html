<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c5a059">
<title>Product | Integrated IT Support</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600;900&display=swap');
:root{--luxury-gold:linear-gradient(135deg,#b8954f 0%,#d8bd84 50%,#9c7322 100%)}
*{box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#050505;color:#fff;margin:0;overflow-x:hidden}
h1,h2,h3,h4,.logo-text{font-family:'Cinzel',serif}a{text-decoration:none}
.gold-text{color:transparent;background:var(--luxury-gold);-webkit-background-clip:text;background-clip:text}
.eyebrow{font-size:8px;letter-spacing:.5em;text-transform:uppercase;color:#c5a059;font-weight:700;display:block}
nav{position:fixed;width:100%;z-index:50;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.05)}
.nav-links{display:flex;gap:22px;font-size:9px;font-weight:700;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.nav-links a:hover{color:#c5a059}@media(max-width:900px){.nav-links{display:none}}
.aud{font-size:8px;letter-spacing:.18em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.6)}
.aud-human{color:#9fe7c7;border-color:rgba(159,231,199,.3)}.aud-ai{color:#9ec5ff;border-color:rgba(158,197,255,.3)}.aud-business{color:#f1dca7;border-color:rgba(241,220,167,.3)}.aud-it{color:#e0a3ff;border-color:rgba(224,163,255,.3)}
.c-btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border:1px solid rgba(197,160,89,.45);background:rgba(197,160,89,.05);color:#c5a059;font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border-radius:5px;cursor:pointer;transition:all .3s}
.c-btn:hover{color:#f1dca7;border-color:rgba(197,160,89,.65)}.c-btn.solid{background:var(--luxury-gold);color:#1a1407;border-color:transparent}.c-btn.solid:hover{box-shadow:0 8px 22px rgba(184,149,79,.25)}.c-btn:disabled{opacity:.6;cursor:wait}
/* shared catalog card (related) */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}@media(max-width:900px){.cat-grid{grid-template-columns:1fr}}
.cat-card{position:relative;display:flex;flex-direction:column;gap:10px;background:linear-gradient(155deg,rgba(197,160,89,.04),rgba(255,255,255,.02) 60%,transparent);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:20px;overflow:hidden}
.cat-card:hover{border-color:rgba(197,160,89,.5)}.cat-card .lock{position:absolute;top:12px;left:12px;color:rgba(197,160,89,.7);font-size:12px}
.cat-card .c-top{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.cat-card .fmt{font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-left:auto}
.cat-card h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:2px 0 0}.cat-card .c-blurb{font-size:11px;color:rgba(255,255,255,.55);margin:0}
.cat-card .c-media{margin:-20px -20px 4px;height:140px;overflow:hidden;background:#0a0a0a;border-bottom:1px solid rgba(197,160,89,.15)}.cat-card .c-media img{width:100%;height:100%;object-fit:cover}
.cat-card.is-soon{opacity:.6;filter:grayscale(.5)}.cat-card .price.soon{color:#9aa3b8;background:none;-webkit-background-clip:initial;font-size:12px;text-transform:uppercase}.cat-card .price.quote{color:#d8bd84;background:none;-webkit-background-clip:initial;font-size:13px}
.cat-card .c-inside{margin:0;padding-left:15px;color:rgba(255,255,255,.4);font-size:10px;line-height:1.7}
.cat-card .c-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px}
.cat-card .price{font-family:'Cinzel',serif;font-size:16px;color:transparent;background:var(--luxury-gold);-webkit-background-clip:text;background-clip:text}.cat-card .price.free{color:#9fe7c7;background:none;-webkit-background-clip:initial}
.c-actions{display:flex;gap:6px}.cat-card .c-btn{padding:8px 12px;font-size:8px;letter-spacing:.18em}
</style>
  <link rel="canonical" href="https://iisupp.net/product">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://iisupp.net/product">
  <meta property="og:title" content="Product | Integrated IT Support">
  <meta property="og:image" content="https://iisupp.net/icons/icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
<nav>
  <a href="/" style="display:flex;align-items:center;gap:14px;color:inherit"><div style="width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid #c5a059;position:relative"><span style="color:#c5a059;font-weight:700;font-size:18px" class="logo-text">I</span></div><span style="font-size:15px;font-weight:700;letter-spacing:.26em;text-transform:uppercase" class="logo-text">Integrated IT Support</span></a>
  <div class="nav-links"><a href="/shop.html">Shop</a><a href="/growth-library.html">Growth Library</a><a href="/services.html">Services</a><a href="/aria.html">ARIA</a></div>
</nav>

<main id="product" style="max-width:980px;margin:0 auto;padding:140px 24px 90px"></main>

<footer style="padding:50px 40px;border-top:1px solid rgba(255,255,255,.05);text-align:center">
  <a href="/shop.html" class="eyebrow" style="color:rgba(255,255,255,.5)">← Back to the Shop</a>
  <p style="color:rgba(255,255,255,.25);font-size:10px;margin-top:14px">© Integrated IT Support Inc. · ahmad.wasee@iisupp.net · (647) 581-3182</p>
</footer>

<script src="/assets/iis-catalog.js"></script>
<script>
(function(){
  var id=new URLSearchParams(location.search).get('id');
  var p=id&&IIS_CATALOG.byId(id);
  var root=document.getElementById('product');
  if(!p){ root.innerHTML='<div style="text-align:center"><h1 style="font-size:28px">Product not found</h1><p style="color:rgba(255,255,255,.5);margin:14px 0 24px">That item isn’t in the catalog.</p><a class="c-btn solid" href="/shop.html">Browse the Shop</a></div>'; return; }
  document.title=p.title+' | Integrated IT Support';
  var esc=IIS_CATALOG.esc, money=IIS_CATALOG.money;
  var badges=(p.audience||[]).map(function(a){return '<span class="aud aud-'+a+'">'+(IIS_CATALOG.audience[a]||a)+'</span>';}).join(' ');
  var isBundle=!!p.items;
  var insideList=(p.inside||[]).map(function(i){return '<li>'+esc(i)+'</li>';}).join('');
  var bundleList=isBundle?'<ul style="columns:2;gap:20px">'+p.items.map(function(x){var c=IIS_CATALOG.byId(x);return c?'<li style="margin:4px 0">'+esc(c.title)+'</li>':'';}).join('')+'</ul>':'';
  var peek=Math.max(1,Math.round((p.priceCents||0)*0.30));
  var actions='<button class="c-btn solid" data-buy="'+esc(p.id)+'-full" onclick="IIS_CATALOG.buy(\''+esc(p.id)+'\',\'full\')">Unlock full · '+money(p.priceCents)+'</button>'+
    '<button class="c-btn" data-buy="'+esc(p.id)+'-peek" onclick="IIS_CATALOG.buy(\''+esc(p.id)+'\',\'peek\')" title="A 30% teaser, credited toward full access">Peek inside · '+money(peek)+'</button>';
  var upsell = p.upsell==='aria'
    ? '<a class="c-btn" href="/aria.html">Want it automated? Meet ARIA →</a>'
    : '<a class="c-btn" href="/services.html">Want it done for you? See services →</a>';
  root.innerHTML =
    '<a href="/shop.html" class="eyebrow" style="color:rgba(255,255,255,.45);margin-bottom:22px">← Shop</a>'+
    '<div style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px">'+badges+(p.format?' <span class="aud" style="border-color:rgba(255,255,255,.1)">'+esc(p.format)+'</span>':'')+'</div>'+
    '<h1 style="font-size:clamp(2rem,4.5vw,3rem);font-weight:900;letter-spacing:-.01em;line-height:1.05;margin:0 0 16px">'+esc(p.title)+'</h1>'+
    '<p style="font-size:16px;color:rgba(255,255,255,.7);line-height:1.7;max-width:680px;margin:0 0 18px">'+esc(p.blurb)+'</p>'+
    (p.long?'<p style="font-size:14px;color:rgba(255,255,255,.55);line-height:1.8;max-width:720px;margin:0 0 26px">'+esc(p.long)+'</p>':'')+
    '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 30px"><span style="font-family:\'Cinzel\',serif;font-size:30px" class="gold-text">'+money(p.priceCents)+'</span><div style="display:flex;gap:10px;flex-wrap:wrap">'+actions+'</div></div>'+
    (insideList?'<h2 style="font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#f1dca7;margin:30px 0 12px">What’s inside</h2><ul style="color:rgba(255,255,255,.65);font-size:14px;line-height:1.9;padding-left:20px">'+insideList+'</ul>':'')+
    (bundleList?'<h2 style="font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#f1dca7;margin:30px 0 12px">Included in this bundle</h2>'+bundleList:'')+
    '<div style="margin:34px 0;padding:20px 22px;border:1px dashed rgba(197,160,89,.35);border-radius:10px;background:rgba(197,160,89,.04);font-size:13px;color:rgba(255,255,255,.6)"><b style="color:#d8bd84">Peek before you commit.</b> The 30% preview shows the structure and a real section — credited toward full access (reply to your receipt). Full unlock includes every step, templates, and the AI-readable version. '+upsell+'</div>';
  // related
  var rel=(p.related||[]).map(IIS_CATALOG.byId).filter(Boolean);
  if(rel.length){
    root.innerHTML+='<h2 style="font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#f1dca7;margin:40px 0 16px">Pairs well with</h2><div class="cat-grid">'+rel.map(IIS_CATALOG.renderCard).join('')+'</div>';
  }
})();
</script>
</body>
</html>
