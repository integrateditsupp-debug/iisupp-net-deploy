<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AXIS · Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0d'/%3E%3Cpath d='M16 6 L24 26 H20.2 L18.6 21.5 H13.4 L11.8 26 H8 Z M14.4 18.4 H17.6 L16 13.6 Z' fill='%23d4af37'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/axis-tokens.css">
</head>
<body>

<!-- Login gate: the static page carries NO prospect data; everything renders only after a valid Aperture session. -->
<div class="login" id="login">
  <div class="login-card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="13.5" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.55"/>
        <ellipse cx="15" cy="15" rx="13.5" ry="5.5" fill="none" stroke="var(--gold)" stroke-width="0.8" opacity="0.35"/>
        <text x="15" y="19.5" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="650" fill="var(--gold)">A</text>
      </svg>
      <div><div style="font-weight:650">AXIS · Command Center</div><div class="eyebrow">Integrated IT Support</div></div>
    </div>
    <input id="email" type="email" placeholder="email" autocomplete="username">
    <input id="pass" type="password" placeholder="password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div id="loginErr" style="color:var(--crit);font-size:11px;margin-top:8px;min-height:14px"></div>
  </div>

  <!-- Public AXIS — generic program status ONLY (headline feed + canned lines). No prospect data,
       no counts, no names pre-auth. Voice is browser-local. -->
  <section class="axis-public" id="axisPublic" aria-label="Ask AXIS — public status">
    <div style="display:flex;align-items:center;gap:11px">
      <span class="axis-orb axis-orb-sm" data-orb></span>
      <div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="eyebrow" style="color:var(--gold)">AXIS · Director</span>
          <span class="axis-state-word" id="axisPubState" aria-live="polite">idle</span>
        </div>
        <div style="font-size:12.5px;color:var(--txt-2);margin-top:2px">Ask AXIS what is live right now.</div>
      </div>
    </div>
    <div class="axis-pub-log" id="axisPubLog" hidden></div>
    <div class="axis-input" style="border-top:none;padding:0">
      <input id="axisPubInput" placeholder="Ask AXIS…" autocomplete="off" aria-label="Ask AXIS a public question">
      <button class="chip" id="axisPubMic" title="Push to talk (Chrome / Edge)" aria-label="Push to talk">🎙</button>
      <button class="chip" id="axisPubVoice" title="Toggle spoken replies" aria-pressed="false" aria-label="Toggle spoken replies">🔊</button>
      <button class="chip" id="axisPubSend">Ask</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="chip" data-pub-q="status">Status</button>
      <button class="chip" data-pub-q="next">Next</button>
      <button class="chip" data-pub-q="help">Help</button>
    </div>
    <div class="eyebrow">public mode · general status only · sign in for the director view</div>
  </section>
</div>

<!-- App shell (hidden until authed) -->
<div class="app" id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="13.5" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.55"/>
        <ellipse cx="15" cy="15" rx="13.5" ry="5.5" fill="none" stroke="var(--gold)" stroke-width="0.8" opacity="0.35"/>
        <text x="15" y="19.5" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="650" fill="var(--gold)">A</text>
      </svg>
      <span class="brand-text">AXIS</span>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="search" id="search">🔍 Search <span class="kbd">⌘K</span></div>
      <span class="tick" id="tick">connecting…</span>
      <span class="dot dot-ok" id="health" title="system health"></span>
      <button class="iconbtn" id="themeBtn" title="toggle theme">◐</button>
      <button class="iconbtn" id="logoutBtn" title="sign out">⎋</button>
    </header>
    <main class="content" id="content"><div class="skeleton" style="height:120px"></div></main>
  </div>

  <!-- AXIS dock -->
  <button class="axis-fab" id="axisFab" title="Ask AXIS" aria-label="Ask AXIS — open the director dock">
    <span class="axis-orb" data-orb></span>
    <span class="axis-fab-pill">Ask AXIS</span>
  </button>
  <section class="axis-dock" id="axisDock" hidden aria-label="AXIS director">
    <header class="axis-dock-head">
      <span style="display:flex;align-items:center;gap:9px">
        <span class="axis-orb axis-orb-xs" data-orb></span>
        <span class="eyebrow" style="color:var(--gold)">AXIS · Director</span>
        <span class="axis-state-word" id="axisStateWord" aria-live="polite">idle</span>
      </span>
      <button class="iconbtn" id="axisClose" aria-label="Close AXIS dock" style="padding:2px 7px">✕</button></header>
    <div class="axis-log" id="axisLog"></div>
    <div class="axis-input"><input id="axisInput" placeholder="Tell AXIS…" autocomplete="off"><button class="chip" id="axisMic" title="Push to talk (Chrome / Edge)" aria-label="Push to talk">🎙</button><button class="chip" id="axisVoice" title="Toggle spoken replies" aria-pressed="false" aria-label="Toggle spoken replies">🔊</button><button class="chip" id="axisSend">Send</button></div>
  </section>
</div>

<!-- ⌘K command palette -->
<div class="palette" id="palette" hidden>
  <div class="palette-box">
    <input id="paletteInput" placeholder="Type a command or screen…" autocomplete="off">
    <div class="palette-list" id="paletteList"></div>
  </div>
</div>

<script type="module" src="/assets/axis-app.js"></script>
</body>
</html>
