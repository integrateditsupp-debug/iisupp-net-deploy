<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<meta name="robots" content="noindex">
<title>Your Downloads | Integrated IT Support</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap');
:root{--luxury-gold:linear-gradient(135deg,#b8954f 0%,#d8bd84 50%,#9c7322 100%)}
*{box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#050505;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
h1,h2,h3{font-family:'Cinzel',serif}
.gold-text{color:transparent;background:var(--luxury-gold);-webkit-background-clip:text;background-clip:text}
.wrap{max-width:640px;width:100%;text-align:center}
.check{width:74px;height:74px;border-radius:50%;background:var(--luxury-gold);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;color:#1a1407;font-size:34px}
.card{background:rgba(255,255,255,.02);border:1px solid rgba(184,149,79,.3);border-radius:14px;padding:38px 30px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;background:var(--luxury-gold);color:#1a1407;font-family:'Cinzel',serif;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:none;border-radius:8px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid rgba(184,149,79,.45);color:#d8bd84}
.btn:hover{box-shadow:0 8px 22px rgba(184,149,79,.22)}
.muted{color:rgba(255,255,255,.45);font-size:12px;line-height:1.7}
a{color:#d8bd84}
</style>
    <link rel="stylesheet" href="/assets/iis-motion.css?v=20260710L">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="check">✓</div>
    <h1 style="font-size:26px;letter-spacing:.04em;margin:0 0 12px">Thank you — <span class="gold-text" style="font-style:italic">you’re in</span>.</h1>
    <p id="intro" style="color:rgba(255,255,255,.65);font-size:14px;line-height:1.7;margin:0 auto 24px;max-width:520px">Your purchase is confirmed.</p>
    <div id="cta" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"></div>
    <p class="muted" style="margin-top:24px">A copy of this link is also in your receipt email — keep it to re-open your library anytime. Trouble? <a href="mailto:ahmad.wasee@iisupp.net">ahmad.wasee@iisupp.net</a> · (647) 581-3182.</p>
  </div>
</div>
<script>
(function(){
  var qs=new URLSearchParams(location.search);
  var sid=qs.get('session_id');
  var intro=document.getElementById('intro'), cta=document.getElementById('cta');
  if(sid){
    intro.innerHTML='Payment received and verified. Open your secure library below — your guides are yours to read and print to PDF anytime from this link.';
    cta.innerHTML='<a class="btn" href="/library-download?session_id='+encodeURIComponent(sid)+'">Open my library →</a>'+
      '<a class="btn ghost" href="/growth-library.html">Back to Growth Library</a>';
  } else {
    intro.innerHTML='Your purchase is confirmed. Your secure download link has been emailed to you — open it to access your library. (Concierge, setup and Finder’s-Fee orders are delivered by our team, typically within one business day.)';
    cta.innerHTML='<a class="btn ghost" href="/growth-library.html">Back to Growth Library</a>';
  }
})();
</script>
  <script src="/assets/iis-motion.js?v=20260710L" defer></script>
</body>
</html>
