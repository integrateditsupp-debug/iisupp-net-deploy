<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;height:100%;background:transparent;}
body{display:flex;align-items:center;justify-content:center;}
svg{display:block;width:400px;height:400px;}
</style></head><body>
<!-- Static (single-frame) render of the live iisupp.net/aria globe for rasterizing into extension icons.
     Fixed 400x400, centered; screenshot at --window-size=400,400 then downscaled to 16/32/128. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="core" cx="36%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#f7e7bd" stop-opacity="1"/>
      <stop offset="55%" stop-color="#c5a059" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#5a3f10" stop-opacity=".15"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="40" fill="url(#glow)"/>
  <circle cx="60" cy="60" r="26" fill="url(#core)"/>
  <g fill="none" stroke="#c5a059">
    <circle cx="60" cy="60" r="26" stroke-opacity=".78" stroke-width="2.2"/>
    <circle cx="60" cy="60" r="17" stroke-opacity=".5"  stroke-width="1.6"/>
    <circle cx="60" cy="60" r="9"  stroke-opacity=".55" stroke-width="1.3"/>
    <line x1="32" y1="60" x2="88" y2="60" stroke-opacity=".55" stroke-width="1.6"/>
    <line x1="60" y1="32" x2="60" y2="88" stroke-opacity=".55" stroke-width="1.6"/>
  </g>
</svg>
</body></html>
