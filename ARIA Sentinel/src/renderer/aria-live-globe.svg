<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="aria-live-globe" role="img" aria-label="ARIA">
  <defs>
    <radialGradient id="alg-core" cx="36%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#f1dca7" stop-opacity=".96"/>
      <stop offset="55%" stop-color="#c5a059" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#5a3f10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="alg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0"/>
    </radialGradient>
    <style>
      .aria-live-globe .alg-glow  { transform-origin: 60px 60px; animation: alg-breathe 4.2s ease-in-out infinite; }
      .aria-live-globe .alg-ring  { transform-origin: 60px 60px; animation: alg-rotate 34s linear infinite; }
      @keyframes alg-rotate  { to { transform: rotate(360deg); } }
      @keyframes alg-breathe { 0%,100% { opacity:.5; transform: scale(1); } 50% { opacity:.95; transform: scale(1.05); } }
    </style>
  </defs>
  <circle class="alg-glow" cx="60" cy="60" r="56" fill="url(#alg-glow)"/>
  <circle cx="60" cy="60" r="22" fill="url(#alg-core)"/>
  <g class="alg-ring" fill="none" stroke="#c5a059">
    <circle cx="60" cy="60" r="22" stroke-opacity=".62" stroke-width=".9"/>
    <circle cx="60" cy="60" r="15" stroke-opacity=".42" stroke-width=".7"/>
    <circle cx="60" cy="60" r="8"  stroke-opacity=".5"  stroke-width=".6"/>
    <line x1="36" y1="60" x2="84" y2="60" stroke-opacity=".5" stroke-width=".8"/>
    <line x1="60" y1="36" x2="60" y2="84" stroke-opacity=".5" stroke-width=".8"/>
  </g>
</svg>
