<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
    <title>ARIA Sentinel Overlay</title>
    <link rel="stylesheet" href="./sentinel.css" />
    <style>
      /* Fix 4 — the page is click-through; only interactive elements catch the mouse when the
         window's ignore-mouse is briefly disabled (card mode / Ctrl+Alt+G). */
      html, body { background: transparent; pointer-events: none; }
      .globe-button, .overlay-card, #overlayCard, .companion-panel, #companionPanel { pointer-events: auto; }
      /* ARIA Companion — a SMALL card BELOW the golden globe (mirrors #overlayCard / .globe-confirm). The globe
         itself is never covered: the panel is anchored under it (top ~104px), centered, bounded, and scrolls
         internally. NEVER inset:0 / full-window — that would hide the globe (Ahmad: "keep the globe"). */
      .companion-panel { position: absolute; top: 104px; left: 50%; transform: translateX(-50%);
        width: 300px; max-width: 92vw; max-height: calc(100vh - 120px); display: flex; flex-direction: column;
        background: linear-gradient(180deg, #141414, #0a0a0a); border: 1px solid #38301d; border-radius: 16px;
        box-shadow: 0 24px 70px rgba(0,0,0,.6); overflow: hidden; color: #fff;
        font: 400 13px/1.5 Inter, system-ui, sans-serif; }
      .companion-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 12px 14px; border-bottom: 1px solid #1c1c1c; flex: 0 0 auto; }
      .companion-title { font: 600 13px/1 Cinzel, Georgia, serif; letter-spacing: .16em; color: #f1dca7; text-transform: uppercase; }
      .companion-head-actions { display: flex; gap: 6px; }
      .companion-icon { width: 28px; height: 28px; border-radius: 8px; border: 1px solid #2a2a2a; background: #141414;
        color: #cbb98a; font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
      .companion-icon:hover { border-color: #c5a059; color: #f1dca7; }
      .companion-body { flex: 1 1 auto; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .companion-lead { font-size: 15px; font-weight: 600; color: #fff; margin: 2px 0 2px; }
      .companion-sub { font-size: 12.5px; color: #9a9a9a; }
      .companion-menu-item, .companion-choice { width: 100%; text-align: left; cursor: pointer; padding: 12px 14px;
        border-radius: 11px; border: 1px solid #2a2a2a; background: linear-gradient(180deg,#141414,#0a0a0a); color: #fff;
        font: inherit; display: block; }
      .companion-menu-item:hover, .companion-choice:hover, .companion-choice.sel { border-color: #c5a059; background: #15110a; }
      .companion-menu-item b, .companion-choice b { display: block; font-size: 13.5px; font-weight: 600; color: #f1dca7; }
      .companion-menu-item span, .companion-choice span { display: block; font-size: 11.5px; color: #8f8f8f; margin-top: 2px; }
      .companion-input { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px; border: 1px solid #2a2a2a;
        background: #0a0a0a; color: #fff; font: inherit; }
      .companion-input:focus { outline: none; border-color: #c5a059; }
      /* Tap-to-speak (on-device Web Speech STT) — optional voice INPUT beside the field; typing always works. */
      .companion-speak { align-self: flex-start; padding: 8px 12px; border-radius: 10px; cursor: pointer;
        font: 600 12px/1 inherit; border: 1px solid #2a2a2a; background: #141414; color: #cbb98a; }
      .companion-speak:hover { border-color: #c5a059; color: #f1dca7; }
      .companion-speak.listening { border-color: #7afbff; color: #7afbff; background: #0b1416; }
      .companion-speak-note { font-size: 10.5px; color: #7a7a7a; margin-top: -2px; }
      .companion-copy { white-space: pre-wrap; word-break: break-word; font: 12px/1.55 ui-monospace, Menlo, monospace;
        background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 11px 12px; color: #eadfc4; }
      .companion-safety { font-size: 11.5px; color: #ffcb6b; }
      .companion-note { font-size: 11.5px; color: #8f8f8f; }
      .companion-actions { display: flex; gap: 8px; margin-top: 4px; }
      .companion-actions .cbtn { flex: 1; padding: 11px 12px; border-radius: 10px; cursor: pointer; font: 600 12.5px/1 inherit; border: 1px solid #2a2a2a; }
      .cbtn.primary { background: linear-gradient(90deg,#c5a059,#f1dca7); color: #15110a; border-color: #c5a059; }
      .cbtn.ghost { background: #141414; color: #cbb98a; }
      .cbtn.ghost:hover { border-color: #c5a059; color: #f1dca7; }
      .cbtn[disabled] { opacity: .45; cursor: default; }
      .companion-status { font-size: 12px; color: #7afbff; min-height: 14px; }
      /* Inlined design-handoff globe (SVG) — single source of truth */
      .aria-globe { display:block; overflow:visible; pointer-events:none; }
      .aria-globe .ring-group { transform-origin:60px 60px; animation: aria-rot 34s linear infinite; }
      .aria-globe .glow        { transform-origin:60px 60px; animation: aria-glow 4.2s ease-in-out infinite; }
      .aria-globe .x-listen, .aria-globe .x-scan, .aria-globe .x-particles, .aria-globe .x-done { display:none; }
      .aria-globe[data-state="listening"]  .x-listen    { display:block; }
      .aria-globe[data-state="diagnosing"] .x-scan      { display:block; }
      .aria-globe[data-state="diagnosing"] .ring-group  { animation-duration:17s; }
      .aria-globe[data-state="fixing"]     .x-particles { display:block; }
      .aria-globe[data-state="fixing"]     .ring-group  { animation-duration:9s; }
      .aria-globe[data-state="done"]       .x-done      { display:block; }
      .aria-globe[data-state="escalation"] .ring-stroke { stroke:#ffcb6b; }
      .aria-globe[data-state="escalation"] .glow        { fill:url(#agAmber); }
      @keyframes aria-rot   { to { transform: rotate(360deg); } }
      @keyframes aria-scan  { to { transform: rotate(-360deg); } }
      @keyframes aria-glow  { 0%,100% { opacity:.5; } 50% { opacity:.92; } }
      @keyframes aria-ping  { 0% { transform:scale(.45); opacity:.55; } 100% { transform:scale(1.15); opacity:0; } }
      @keyframes aria-rise  { 0% { transform:translateY(2px); opacity:0; } 25% { opacity:.95; } 100% { transform:translateY(-30px); opacity:0; } }
      @keyframes aria-draw  { from { stroke-dashoffset:44; } to { stroke-dashoffset:0; } }
      /* Attention wiggle — 300ms, ±5px, fired once per session on the first detection. */
      @keyframes aria-attention { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
      .aria-globe[data-state="attention"] { animation: aria-attention .3s ease-in-out 1; }
      /* "Done" flourish — cyan check (x-done) + a gold ring sweep. Pure CSS, no Lottie. */
      @keyframes aria-done-ring { 0% { transform: scale(.5); opacity:.9; } 100% { transform: scale(1.25); opacity:0; } }
      .aria-globe[data-state="done"] .glow { animation: aria-done-ring .6s ease-out forwards; fill: url(#agGold); }

      .globe-button {
        position: absolute;
        top: 12px;
        left: 50%;
        width: 88px;
        height: 88px;
        transform: translateX(-50%);
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        padding: 0;
        border: 0;
        outline: none;
      }
      .globe-button:focus { outline: none; }
      .globe-button:hover .aria-globe { filter: drop-shadow(0 0 14px rgba(241,220,167,.45)); }
      .overlay-body.card-visible .globe-button { top: 8px; }
      .globe-greeting {
        pointer-events: none; position: absolute; top: 6px; left: 50%; transform: translate(-50%, -116%);
        max-width: 220px; padding: 7px 11px; border-radius: 11px; font: 500 12.5px/1.35 -apple-system, Segoe UI, system-ui, sans-serif;
        color: #f4ead0; background: rgba(20,24,33,.94); border: 1px solid rgba(197,160,89,.5);
        box-shadow: 0 6px 20px rgba(0,0,0,.42); white-space: normal; text-align: center;
        opacity: 0; transition: opacity .28s ease; }
      .globe-greeting.show { opacity: 1; }
      /* RUN-B B5 - "issue resolved | email sent | ticket reference" confirmation, DIRECTLY UNDER the globe. */
      .globe-confirm {
        pointer-events: auto; position: absolute; top: 104px; left: 50%; transform: translate(-50%, 6px);
        max-width: 264px; padding: 9px 12px; border-radius: 12px; text-align: center;
        font: 500 12.5px/1.4 -apple-system, Segoe UI, system-ui, sans-serif;
        color: #eafcff; background: rgba(14,20,28,.96); border: 1px solid rgba(122,251,255,.42);
        box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 14px rgba(122,251,255,.12);
        white-space: normal; cursor: pointer; opacity: 0; transition: opacity .3s ease; }
      .globe-confirm.show { opacity: 1; }
    </style>
  </head>
  <body class="overlay-body globe-only">
    <button id="overlayGlobe" class="globe-button" type="button" aria-label="Open ARIA Sentinel">
      <svg class="aria-globe" data-state="idle" width="72" height="72" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <radialGradient id="agCore" cx="36%" cy="34%" r="62%">
            <stop offset="0%"  stop-color="#f1dca7" stop-opacity=".95"/>
            <stop offset="55%" stop-color="#c5a059" stop-opacity=".68"/>
            <stop offset="100%" stop-color="#5a3f10" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="agGold" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#c5a059" stop-opacity=".34"/>
            <stop offset="100%" stop-color="#c5a059" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="agAmber" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffcb6b" stop-opacity=".42"/>
            <stop offset="100%" stop-color="#ffcb6b" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle class="glow" cx="60" cy="60" r="56" fill="url(#agGold)"/>
        <g class="x-listen">
          <circle class="ring-stroke" cx="60" cy="60" r="24" fill="none" stroke="#c5a059" stroke-width="1" style="transform-origin:60px 60px; animation: aria-ping 2.6s ease-out infinite;"/>
          <circle class="ring-stroke" cx="60" cy="60" r="24" fill="none" stroke="#c5a059" stroke-width="1" style="transform-origin:60px 60px; animation: aria-ping 2.6s ease-out infinite 1.3s;"/>
        </g>
        <circle cx="60" cy="60" r="22" fill="url(#agCore)"/>
        <g class="ring-group">
          <circle class="ring-stroke" cx="60" cy="60" r="22" fill="none" stroke="#c5a059" stroke-opacity=".62" stroke-width=".9"/>
          <circle class="ring-stroke" cx="60" cy="60" r="15" fill="none" stroke="#c5a059" stroke-opacity=".42" stroke-width=".7"/>
          <circle class="ring-stroke" cx="60" cy="60" r="8"  fill="none" stroke="#c5a059" stroke-opacity=".5"  stroke-width=".6"/>
          <line class="ring-stroke" x1="36" y1="60" x2="84" y2="60" stroke="#c5a059" stroke-opacity=".5" stroke-width=".8"/>
          <line class="ring-stroke" x1="60" y1="36" x2="60" y2="84" stroke="#c5a059" stroke-opacity=".5" stroke-width=".8"/>
        </g>
        <circle class="x-scan" cx="60" cy="60" r="27" fill="none" stroke="#f1dca7" stroke-width="1.6" stroke-dasharray="7 5" stroke-opacity=".85" style="transform-origin:60px 60px; animation: aria-scan 5s linear infinite;"/>
        <g class="x-particles" fill="#f1dca7">
          <circle cx="48" cy="40" r="1.7" style="animation: aria-rise 1.8s ease-in infinite;"/>
          <circle cx="62" cy="36" r="1.3" style="animation: aria-rise 1.8s ease-in infinite .4s;"/>
          <circle cx="72" cy="42" r="1.6" style="animation: aria-rise 1.8s ease-in infinite .8s;"/>
          <circle cx="55" cy="34" r="1.2" style="animation: aria-rise 1.8s ease-in infinite 1.1s;"/>
          <circle cx="68" cy="32" r="1.4" style="animation: aria-rise 1.8s ease-in infinite .6s;"/>
        </g>
        <path class="x-done" d="M 50 60 L 57 67 L 73 49" fill="none" stroke="#7afbff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="44" style="animation: aria-draw .55s ease-out forwards;"/>
      </svg>
    </button>

    <!-- RUN 15 §2 — ambient greeting bubble (Hi / periodic / 10-min chat prompt). -->
    <div id="overlayGreeting" class="globe-greeting" role="status" aria-live="polite" hidden></div>

    <!-- RUN-B B5 - the "issue resolved | email sent | ticket reference" confirmation, directly under the globe. -->
    <div id="overlayConfirm" class="globe-confirm" role="status" aria-live="polite" hidden></div>

    <section id="overlayCard" class="fix-card overlay-card" aria-live="polite" hidden>
      <span id="overlayChip" class="chip">MANUAL MODE</span>
      <h3 id="overlayTitle">ARIA is watching</h3>
      <p id="overlayBody">Local self-diagnosis is active.</p>
      <div class="button-row">
        <button id="overlayFix" class="primary">Open fix</button>
        <button id="overlayDismiss" class="ghost">Dismiss</button>
      </div>
    </section>

    <!-- ARIA Companion — the interactive, input-collecting assistant. Guide/learn changes NOTHING on the PC. -->
    <section id="companionPanel" class="companion-panel" aria-live="polite" hidden>
      <header class="companion-head">
        <span class="companion-title">ARIA</span>
        <div class="companion-head-actions">
          <button id="companionMute" class="companion-icon" type="button" title="Mute narration" aria-label="Mute narration" aria-pressed="false">&#128266;</button>
          <button id="companionBack" class="companion-icon" type="button" title="Back" aria-label="Back" hidden>&lsaquo;</button>
          <button id="companionClose" class="companion-icon" type="button" title="Close" aria-label="Close">&times;</button>
        </div>
      </header>
      <div id="companionBody" class="companion-body"></div>
    </section>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
