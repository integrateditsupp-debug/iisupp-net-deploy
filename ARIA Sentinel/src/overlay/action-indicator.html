<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <title>ARIA Sentinel — running</title>
  <link rel="stylesheet" href="action-indicator.css" />
</head>
<body>
  <div id="actionIndicator"></div>
  <script type="module">
    import { buildIndicator, bindIndicator } from "./action-indicator.mjs";
    const host = document.getElementById("actionIndicator");
    const bridge = window.sentinelBridge || window.sentinel || null;

    function render(info) {
      host.innerHTML = buildIndicator(info || {});
      bindIndicator(host, bridge);
    }

    // The main process pushes {recipeId, remaining, risk} once per second during the countdown.
    if (bridge && typeof bridge.onCountdownTick === "function") {
      bridge.onCountdownTick((info) => render(info));
    }
  </script>
</body>
</html>
