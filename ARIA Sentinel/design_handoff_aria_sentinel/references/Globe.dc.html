<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes ariaRot { to { transform: rotate(360deg); } }
@keyframes ariaScan { to { transform: rotate(-360deg); } }
@keyframes ariaGlow { 0%,100% { opacity: .5; } 50% { opacity: .92; } }
@keyframes ariaPing { 0% { transform: scale(.45); opacity: .55; } 100% { transform: scale(1.15); opacity: 0; } }
@keyframes ariaRise { 0% { transform: translateY(2px); opacity: 0; } 25% { opacity: .95; } 100% { transform: translateY(-30px); opacity: 0; } }
@keyframes ariaDraw { from { stroke-dashoffset: 44; } to { stroke-dashoffset: 0; } }
@keyframes ariaFlash { 0% { opacity: 0; } 28% { opacity: .55; } 100% { opacity: 0; } }
</style>
</helmet>
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 120 120" style="display:block; overflow:visible;">
  <defs>
    <radialGradient id="agCore" cx="36%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#f1dca7" stop-opacity="0.95"></stop>
      <stop offset="55%" stop-color="#c5a059" stop-opacity="0.68"></stop>
      <stop offset="100%" stop-color="#5a3f10" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="agGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.34"></stop>
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="agAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcb6b" stop-opacity="0.42"></stop>
      <stop offset="100%" stop-color="#ffcb6b" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  <circle cx="60" cy="60" r="56" fill="{{ glowFill }}" style="animation: ariaGlow 4.2s ease-in-out infinite; transform-origin: 60px 60px;"></circle>

  <sc-if value="{{ isListening }}" hint-placeholder-val="{{ false }}">
    <g>
      <circle cx="60" cy="60" r="24" fill="none" stroke="{{ ringColor }}" stroke-width="1" style="transform-origin:60px 60px; animation: ariaPing 2.6s ease-out infinite;"></circle>
      <circle cx="60" cy="60" r="24" fill="none" stroke="{{ ringColor }}" stroke-width="1" style="transform-origin:60px 60px; animation: ariaPing 2.6s ease-out infinite; animation-delay: 1.3s;"></circle>
    </g>
  </sc-if>

  <circle cx="60" cy="60" r="22" fill="url(#agCore)"></circle>

  <g style="transform-origin: 60px 60px; animation: ariaRot 34s linear infinite;">
    <circle cx="60" cy="60" r="22" fill="none" stroke="{{ ringColor }}" stroke-opacity="0.62" stroke-width="0.9"></circle>
    <circle cx="60" cy="60" r="15" fill="none" stroke="{{ ringColor }}" stroke-opacity="0.42" stroke-width="0.7"></circle>
    <circle cx="60" cy="60" r="8" fill="none" stroke="{{ ringColor }}" stroke-opacity="0.5" stroke-width="0.6"></circle>
    <line x1="36" y1="60" x2="84" y2="60" stroke="{{ ringColor }}" stroke-opacity="0.5" stroke-width="0.8"></line>
    <line x1="60" y1="36" x2="60" y2="84" stroke="{{ ringColor }}" stroke-opacity="0.5" stroke-width="0.8"></line>
  </g>

  <sc-if value="{{ isDiagnosing }}" hint-placeholder-val="{{ false }}">
    <circle cx="60" cy="60" r="27" fill="none" stroke="#f1dca7" stroke-width="1.6" stroke-dasharray="7 5" stroke-opacity="0.85" style="transform-origin:60px 60px; animation: ariaScan 5s linear infinite;"></circle>
  </sc-if>

  <sc-if value="{{ isFixing }}" hint-placeholder-val="{{ false }}">
    <g fill="#f1dca7">
      <circle cx="48" cy="40" r="1.7" style="transform-origin:center; animation: ariaRise 1.8s ease-in infinite;"></circle>
      <circle cx="62" cy="36" r="1.3" style="transform-origin:center; animation: ariaRise 1.8s ease-in infinite; animation-delay:.4s;"></circle>
      <circle cx="72" cy="42" r="1.6" style="transform-origin:center; animation: ariaRise 1.8s ease-in infinite; animation-delay:.8s;"></circle>
      <circle cx="55" cy="34" r="1.2" style="transform-origin:center; animation: ariaRise 1.8s ease-in infinite; animation-delay:1.1s;"></circle>
      <circle cx="68" cy="32" r="1.4" style="transform-origin:center; animation: ariaRise 1.8s ease-in infinite; animation-delay:.6s;"></circle>
    </g>
  </sc-if>

  <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
    <g>
      <circle cx="60" cy="60" r="50" fill="#f1dca7" style="transform-origin:60px 60px; animation: ariaFlash 1.4s ease-out;"></circle>
      <path d="M 50 60 L 57 67 L 73 49" fill="none" stroke="#7afbff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="44" style="animation: ariaDraw .55s ease-out forwards;"></path>
    </g>
  </sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;listening&quot;,&quot;diagnosing&quot;,&quot;fixing&quot;,&quot;done&quot;,&quot;escalation&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;min&quot;:32,&quot;max&quot;:260,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? "idle";
    const isEsc = state === "escalation";
    return {
      size: this.props.size ?? 120,
      state,
      ringColor: isEsc ? "#ffcb6b" : "#c5a059",
      glowFill: isEsc ? "url(#agAmber)" : "url(#agGold)",
      isListening: state === "listening",
      isDiagnosing: state === "diagnosing",
      isFixing: state === "fixing",
      isDone: state === "done",
      isEscalation: isEsc,
    };
  }
}
</script>
</body>
</html>
