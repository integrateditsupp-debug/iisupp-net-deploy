name: Deploy to Netlify on merge to main

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Trigger Netlify production deploy
    steps:
      - name: Trigger Netlify build hook
        run: |
          curl -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK_URL }}"
