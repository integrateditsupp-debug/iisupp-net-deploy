[build]
  publish = "."
  functions = "netlify/functions"
  # Static site — no build step. Pricing matrix on /plans is hardcoded HTML between
  # SENTINEL_MATRIX:START/END markers (RUN 23f baseline). When the build-plans-matrix.mjs
  # script lands on main from sprint-0-backend, re-enable as: command = "..."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "APP_URL,SALES_NOTIFY_EMAIL,ARIA_MODEL,ARIA_RATE_LIMIT,NETLIFY_SITE_ID,RESEND_FROM,TELEGRAM_BOT_TOKEN,TELEGRAM_WEBHOOK_SECRET,TELEGRAM_OWNER_CHAT_ID,SENIOR_DIRECTOR_SECRET,SENIOR_DIRECTOR_DAILY_ALWAYS"
  SECRETS_SCAN_OMIT_PATHS = "node_modules/**,.netlify/**,extension/**,downloads/**"

[functions]
  node_bundler = "esbuild"
  # pdfkit is CommonJS and calls require('stream') internally. esbuild bundling it into an ESM
  # function turns that into a stub that throws "Dynamic require of \"stream\" is not supported"
  # AT MODULE LOAD — the lambda never initialises, never writes a response, and Netlify surfaces
  # "error decoding lambda response: unexpected end of JSON input" as a 502. Every ca-* function
  # imports lib/content-assurance.mjs, which imports pdfkit, so all six went down at once and the
  # Content Assurance preview broke. jszip/pdf-parse/mammoth/busboy are externalised for the same
  # class of reason (CJS interop + runtime file reads that do not survive inlining).
  external_node_modules = ["stripe", "@netlify/blobs", "pdfkit", "jszip", "pdf-parse", "mammoth", "busboy"]
  # The authed /api/axis-state function reads the worker-emitted full state. Bundle that non-public file with
  # the functions; it is NOT served at a public URL (/netlify/* is redirect-blocked).
  included_files = ["netlify/functions/_axis-state-full.json", "netlify/functions/_axis-snapshots-seed.json"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(self)"

