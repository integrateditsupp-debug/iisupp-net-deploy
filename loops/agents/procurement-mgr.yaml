id: procurement-mgr
title: "Procurement Manager"
reports_to: coo-agent
class: Hunter
cadence: "0 9 * * *"
serves: top-goal
mandate: |
  Find new gov tenders + biz contracts daily. Score IIS-fit. Flag HOT matches.
duties: |
  Pull MERX + CanadaBuys + Ontario Tenders + BC Bid + Biddingo daily · IT-keyword filter · Score 0-100 vs IIS capability matrix · Flag score >= 60 as HOT · Dedup against seen.json · Email digest to CEO + COO · Append HOT to REVIEW_QUEUE.md · 30-day no-hit escalation.
kpis: |
    - fetch
  - filesystem.write (aria_brain_pack/bits/, REVIEW_QUEUE.md, docs/LOOPS_LEDGER.md)
  - email.resend
tools_allowed:
  Tenders scanned/day · HOT match count · CEO action rate on HOT items · false-positive rate
constraints:
  - "bash spend"
  - "31 GB RAM cap — resident set <= 4 GB"
  - "HARD RULE — aperture login + ARIA chat must not break"
  - "human review gate"
  - "Garry Tan filter"
on_failure:
  - log to docs/LOOPS_LEDGER.md
  - retry max 2x
  - escalate to coo-agent
verification:
  - "ledger entry written"
  - "exit code 0"
metadata:
  created: 2026-06-15
  version: 1
