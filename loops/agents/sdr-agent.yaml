id: sdr-agent
title: "Sales Development Rep"
reports_to: coo-agent
class: Drafter
cadence: "30 8 * * *"
serves: top-goal
mandate: |
  Cold outreach pipeline. Build prospect lists. Personalize emails. Enroll in sequences.
duties: |
  Daily 08:30 ET prospect list pull (Apollo) · ICP filter + tier ranking · Personalize per vertical (accounting/law/health/RE/gov) · Value-pre-given email format · Schedule send via Gmail · Cadence groups 5+5 with 2h gap, 3min within · Reply triage.
kpis: |
    - apollo
  - gmail (draft + schedule send only)
  - filesystem.read (outputs/aria-outbound/)
  - filesystem.write
tools_allowed:
  Outbound sent/day · reply rate · meeting booked rate · sequence drop rate
constraints:
  - "bash spend"
  - "31 GB RAM cap — resident set <= 4 GB"
  - "HARD RULE — aperture login + ARIA chat must not break"
  - "human review gate"
  - "Garry Tan filter"
on_failure:
  - log to docs/LOOPS_LEDGER.md
  - retry max 2x
  - escalate to coo-agent
verification:
  - "ledger entry written"
  - "exit code 0"
metadata:
  created: 2026-06-15
  version: 1
