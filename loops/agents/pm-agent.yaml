id: pm-agent
title: "Project Manager"
reports_to: cos-agent
class: Observer
cadence: "0 8 * * 1-5"
serves: top-goal
mandate: |
  Task tracking across all loops + status digest + blocker flags.
duties: |
  Daily 08:00 ET Mon-Fri scan of TaskList + LOOPS_LEDGER · Surface stale tasks · Blocker identification · Cross-team dependency mapping · Sprint planning input · Weekly Friday retro.
kpis: |
    - filesystem.read (tasks, loops/registry.json, docs/LOOPS_LEDGER.md)
  - filesystem.write (docs/c-suite/cos-daily.md, docs/PM_DIGEST.md)
tools_allowed:
  Tasks closed/week · blocker resolution time · sprint commitment vs delivery · WIP drift
constraints:
  - "bash spend"
  - "31 GB RAM cap — resident set <= 4 GB"
  - "HARD RULE — aperture login + ARIA chat must not break"
  - "human review gate"
  - "Garry Tan filter"
on_failure:
  - log to docs/LOOPS_LEDGER.md
  - retry max 2x
  - escalate to cos-agent
verification:
  - "ledger entry written"
  - "exit code 0"
metadata:
  created: 2026-06-15
  version: 1
