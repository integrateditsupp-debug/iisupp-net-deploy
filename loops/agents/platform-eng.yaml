id: platform-eng
title: "Platform Engineer"
reports_to: cto-agent
class: Observer
cadence: "0 9,17 * * 1-5"
serves: top-goal
mandate: |
  Watch Codex + Cowork commit patterns. Surface working-style deltas. Architectural drift detection.
duties: |
  Twice-daily Mon-Fri scan of git log · Classify commits by agent (Codex/Cowork/human) · Detect: churn spikes, new dirs, abandoned files, broken commit-message convention · Write delta report to outputs/codex-observer/playbook-delta.md · Flag drift to CTO.
kpis: |
    - bash (git log only)
  - filesystem.read (.git/)
  - filesystem.write (outputs/codex-observer/, .codex-observer/)
tools_allowed:
  Scan completion rate · delta accuracy · CTO action rate on flags
constraints:
  - "bash spend"
  - "31 GB RAM cap — resident set <= 4 GB"
  - "HARD RULE — aperture login + ARIA chat must not break"
  - "human review gate"
  - "Garry Tan filter"
on_failure:
  - log to docs/LOOPS_LEDGER.md
  - retry max 2x
  - escalate to cto-agent
verification:
  - "ledger entry written"
  - "exit code 0"
metadata:
  created: 2026-06-15
  version: 1
